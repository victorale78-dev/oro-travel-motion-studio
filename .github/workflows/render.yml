name: Render Discover Nicaragua MP4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate media assets
        run: |
          for file in granada.jpg ometepe.jpg corn-islands.jpg san-juan.jpg; do
            if [ ! -s "public/images/$file" ]; then
              echo "::error::Missing public/images/$file. Add the actual destination photo before rendering."
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome for Remotion
        run: npx remotion browser ensure
      - name: Render video
        run: npm run render
      - name: Upload downloadable MP4
        uses: actions/upload-artifact@v4
        with:
          name: discover-nicaragua-mp4
          path: out/discover-nicaragua.mp4
          if-no-files-found: error
          retention-days: 14
